<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BESTELL-APP</title>
  <link rel="stylesheet" href="./css/standard.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./css/fonts.css">
  <link rel="stylesheet" href="./css/style_tablet.css">
  <link rel="stylesheet" href="./css/mobile_style.css">

  <link rel="icon" href="./assets/Favicon/favicon-32x32.png" type="image/png" sizes="16x16">
</head>

<body onload="initOnload()">

  <header>
    <div class="header_grafik">
      <img class="bestell_logo" src="./assets/Logo/Logo.png" alt="BESTELL-APP-Logo">
      <h1>Der scharfe Gaumen</h1>
    </div>
    <div class="sort_header_nav">
      <p class="evaluation_grafik">Bewertung (4.8 von 5 Sternen)</p>
      <nav class="nav_grafik">
        <a href="./index.html" class="start_grafik">Start</a>
        <a href="./html/contact.html" class="contact_grafik">Kontakt</a>
        <a href="./html/impressum.html" class="impressum_grafik">Impressum</a>
      </nav>
    </div>
  </header>

  <main class="my_restaurant">
    <!-- Renders the restaurant menu content dynamically. -->
    <section class="dishes" id="section_dishes">
      <div id="show_dishes"></div>
    </section>

    <!-- Displays the shopping basket and calculated prices. -->
    <section class="shopping_basket" id="section_basket">
      <div class="basket_grafik" id="show_basket">
        <h2 id="headline_h2">Ihr Warenkorb ...</h2>
        <!-- Displays the selected dishes. -->
        <div class="selection_grafik" id="select_dishes"></div>
        <hr class="line_grafik">
        <div class="price_box" id="go_subtotal"></div>
        <div class="price_box" id="travel_expenses"></div>
        <div class="price_box" id="total_amount"></div>
        <div class="button_position" id="button_position">
          <!-- Submits the current basket as a test order. -->
          <button class="button_grafik" id="order_button" onclick="placeTheOrder()">Bestellung aufgeben</button>
        </div>
        <!-- Displays order confirmation or empty-basket feedback. -->
        <div class="boxError" id="errorOrder"></div>
        <button class="button_close_basket" id="button_close_basket" onclick="mobileCloseBasket()" hidden>
          Warenkorb schließen
        </button>
      </div>
    </section>
    <button class="button_open_basket" id="button_open_basket" onclick="mobileShowBasket()">
      Warenkorb</button>

  </main>

  <footer class="footer_grafik">
    <!-- IconScout credit for basket control icons. -->
    <a href="https://iconscout.com/icons/plus" class="icon_thanks" target="_blank" rel="noopener noreferrer">ICONS by Zainal
      Abidin</a>
    <!-- Icons8 credit for the wok icon. -->
    <a class="icon_thanks" href="https://icons8.com/" target="_blank" rel="noopener noreferrer" title="icons8">WOK-ICON von
      icons8.com</a>
    <!-- Links to the current privacy policy. -->
    <a href="./assets/datenschutzerklaerung_github_com_de.pdf" class="privacy_policy">Datenschutzerklärung</a>
    <p class="copyright_jm">(C) Jürgen Malinowski, 17.09.2025</p>
  </footer>

  <script src="./js/db.js"></script>
  <script src="./js/template.js"></script>
  <script src="./script.js"></script>
</body>

</html>
